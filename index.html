<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Bicep</title>
<meta name="description" content="Golden Bicep — an iOS workout tracker. Log your sessions, track body measurements, and watch your progress on beautiful charts.">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
  :root {
    /* Same stops as the in-app paywall: linear, 180deg, warm cream into soft blue. */
    --sheet: linear-gradient(180deg, #f9e6be 0%, #f9f1e0 28%, #dde7ff 100%);
    --fg: #1c1b19;
    --muted: #5f5b54;
    --accent: #b87d0e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* Tonal equivalent so the page is not blinding at night, same warm-to-cool travel. */
      --sheet: linear-gradient(180deg, #2a2418 0%, #211f1a 28%, #171b28 100%);
      --fg: #ece8e1;
      --muted: #a29c92;
      --accent: #e0a92f;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sheet) no-repeat fixed;
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    text-align: center;
  }
  main { max-width: 34rem; }
  .icon {
    display: block;
    width: 320px;
    height: 320px;
    max-width: 78vw;
    max-height: 78vw;
    margin: 0 auto 1.5rem;
    /* The artwork is a transparent PNG, so it sits straight on the gradient. */
    filter: drop-shadow(0 12px 28px rgba(90, 60, 0, .22));
  }
  h1 {
    font-size: clamp(2.1rem, 8vw, 3rem);
    line-height: 1.1;
    letter-spacing: -.025em;
    margin: 0 0 .5rem;
  }
  .tagline { color: var(--muted); margin: 0 0 2rem; font-size: 1.05rem; }
  /* Apple requires the badge be used unmodified, with clear space around it of at
     least 10% of its height. Nothing here recolors, crops, or overlays it. */
  .badge-link {
    display: inline-block;
    margin: 0 0 2.25rem;
    padding: 6px;
    border-radius: 10px;
  }
  .badge-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .badge { display: block; height: 54px; width: auto; }
  .links { margin: 0; font-size: .95rem; }
  .links a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    font-weight: 500;
    white-space: nowrap;
  }
  .links .sep { color: var(--muted); margin: 0 .6rem; }
  @media (max-width: 24rem) {
    /* Stack rather than let the address wrap mid-word on narrow phones. */
    .links a { display: block; margin: .35rem 0; }
    .links .sep { display: none; }
  }
</style>
</head>
<body>
  <main>
    <img class="icon" src="./icon.png" width="640" height="640"
         alt="Golden Bicep app icon — a flexed golden bicep">
    <h1>Golden Bicep</h1>
    <p class="tagline">An iOS workout tracker. Log your sessions, track your body measurements, and watch your progress on beautiful charts.</p>

    <a class="badge-link" href="https://apps.apple.com/app/id6797582908"
       target="_blank" rel="noopener noreferrer">
      <picture>
        <!-- Apple's white lockup is the one specified for dark backgrounds. -->
        <source srcset="./app-store-badge-white.svg" media="(prefers-color-scheme: dark)">
        <img class="badge" src="./app-store-badge.svg"
             alt="Download on the App Store" width="162" height="54">
      </picture>
    </a>

    <p class="links">
      <a href="./privacy/">Privacy Policy</a><span class="sep" aria-hidden="true">·</span><a href="mailto:support@goldenbicep.app">support@goldenbicep.app</a>
    </p>
  </main>
</body>
</html>
