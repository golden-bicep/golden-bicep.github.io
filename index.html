<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Bicep</title>
<meta name="description" content="Golden Bicep — an iOS workout tracker.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfaf3; --fg: #1c1b19; --muted: #5f5b54; --accent: #c8901a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --fg: #ece8e1; --muted: #a29c92; --accent: #e0a92f; }
  }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center; padding: 2rem;
  }
  h1 { font-size: 2rem; margin: 0 0 .4rem; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a { color: var(--accent); text-underline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>Golden Bicep</h1>
    <p>An iOS workout tracker.</p>
    <p><a href="./privacy/">Privacy Policy</a></p>
  </main>
</body>
</html>
